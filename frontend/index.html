<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <script>
      window.global = window;
      (function() {
        try {
          var saved = localStorage.getItem('eventchat_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EventChat — Bàn nhanh. Chốt rõ. Chia sẻ ngay.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      #initial-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f8fafc;
        color: #0f172a;
        transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        user-select: none;
      }
      .dark #initial-splash {
        background-color: #020617;
        color: #f8fafc;
      }
      .splash-logo-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 12px;
      }
      .splash-halo {
        position: absolute;
        width: 80px;
        height: 80px;
        border-radius: 9999px;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.28) 0%, rgba(139, 92, 246, 0.12) 50%, transparent 70%);
        animation: splash-pulse 2.2s ease-in-out infinite;
        filter: blur(14px);
      }
      .splash-logo-box {
        position: relative;
        z-index: 2;
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: linear-gradient(135deg, #6366f1, #4f46e5);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 25px -4px rgba(99, 102, 241, 0.35);
        animation: splash-float 2.5s ease-in-out infinite;
      }
      .splash-logo-icon {
        width: 28px;
        height: 28px;
        color: white;
      }
      .splash-title {
        font-family: Outfit, Inter, sans-serif;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.025em;
        margin: 0;
        color: #0f172a;
      }
      .dark .splash-title {
        color: #ffffff;
      }
      .splash-subtitle {
        font-family: Inter, sans-serif;
        font-size: 12px;
        color: #64748b;
        margin-top: 2px;
        margin-bottom: 12px;
        font-weight: 500;
      }
      .dark .splash-subtitle {
        color: #94a3b8;
      }
      .splash-dots {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .splash-dot {
        width: 8px;
        height: 8px;
        border-radius: 9999px;
      }
      .splash-dot-1 {
        background-color: #6366f1;
        animation: splash-bounce 1.2s ease-in-out infinite 0s;
      }
      .splash-dot-2 {
        background-color: #818cf8;
        animation: splash-bounce 1.2s ease-in-out infinite 0.2s;
      }
      .splash-dot-3 {
        background-color: #34d399;
        animation: splash-bounce 1.2s ease-in-out infinite 0.4s;
      }
      @keyframes splash-float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); opacity: 0.5; }
        50% { transform: scale(1.25); opacity: 0.9; }
      }
      @keyframes splash-bounce {
        0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
        40% { transform: translateY(-5px); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="initial-splash">
      <div class="splash-logo-wrap">
        <div class="splash-halo"></div>
        <div class="splash-logo-box">
          <svg class="splash-logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            <path d="m10 8-3 3 3 3"/>
            <path d="m14 8 3 3-3 3"/>
          </svg>
        </div>
      </div>
      <h2 class="splash-title">EventChat</h2>
      <p class="splash-subtitle">Bàn nhanh. Chốt rõ.</p>
      <div class="splash-dots">
        <span class="splash-dot splash-dot-1"></span>
        <span class="splash-dot splash-dot-2"></span>
        <span class="splash-dot splash-dot-3"></span>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
