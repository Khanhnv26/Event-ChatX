name: eventchat-prod
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: eventchat_db
      MYSQL_USER: eventchat
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h localhost -u root --silent']
      interval: 10s
      timeout: 5s
      retries: 15
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: eventchat
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD}
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: [CMD-SHELL, 'mongosh --quiet --eval "quit(db.runCommand({ping:1}).ok ? 0 : 1)"']
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping']
      interval: 10s
      timeout: 5s
      retries: 10
  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: eventchat
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
    volumes:
      - rabbit_data:/var/lib/rabbitmq
      - ./deploy/rabbitmq-plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 10s
      retries: 15
  backend:
    build: ./backend
    restart: unless-stopped
    image: ghcr.io/khanhnv26/eventchat-backend:latest
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/eventchat_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: eventchat
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_MONGODB_URI: mongodb://eventchat:${MONGO_PASSWORD}@mongo:27017/eventchat?authSource=admin
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_RABBITMQ_USERNAME: eventchat
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:?Set APP_ALLOWED_ORIGINS}
      APP_RATE_LIMIT_TRUSTED_PROXIES: 172.28.240.10,172.28.240.11
    depends_on:
      mysql: {condition: service_healthy}
      mongo: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
  frontend:
    image: ghcr.io/khanhnv26/eventchat-frontend:latest
    build: ./frontend
    restart: unless-stopped
    networks:
      default: {ipv4_address: 172.28.240.10}
    depends_on:
      backend: {condition: service_healthy}
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    networks:
      default: {ipv4_address: 172.28.240.11}
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend]

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d' # Tự xóa dữ liệu cũ quá 15 ngày để nhẹ ổ cứng
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend: { condition: service_healthy }

  grafana:
      image: grafana/grafana:11.2.0
      restart: unless-stopped
      environment:
        GF_SECURITY_ADMIN_USER: admin
        GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD}
        GF_USERS_ALLOW_SIGN_UP: "false"
      ports:
        - "3000:3000"
      volumes:
        - ./deploy/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
        - grafana_data:/var/lib/grafana
      depends_on:
        - prometheus

volumes:
  mysql_data:
  mongo_data:
  redis_data:
  rabbit_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.240.0/24
