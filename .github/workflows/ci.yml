name: CI/CD Pipeline

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B test
        working-directory: backend
        env:
          EVENTCHAT_TEST_REDIS: 'true'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test && npm run lint && npm run build
        working-directory: frontend

  build-and-push:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/khanhnv26/eventchat-backend:latest
            ghcr.io/khanhnv26/eventchat-backend:${{ github.sha }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/khanhnv26/eventchat-frontend:latest
            ghcr.io/khanhnv26/eventchat-frontend:${{ github.sha }}

  deploy:
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: GitOps Deploy to Azure VM via SSH
        if: env.AZURE_VM_HOST != ''
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          password: ${{ secrets.AZURE_VM_PASSWORD }} # Hoặc dùng key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            set -e
            cd ~/Event-ChatX
            git checkout main
            git pull origin main

            # Đăng nhập GHCR trên máy ảo để kéo image
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Kéo image mới đã được GitHub Actions build sẵn
            docker compose -f compose.production.yaml pull backend frontend

            # Khởi động lại container với image mới mà không cần tự build trên VM
            docker compose -f compose.production.yaml up -d --no-build

            # Đợi và kiểm tra Healthcheck nội bộ
            echo "Waiting for backend healthcheck..."
            for i in $(seq 1 30); do
              if docker compose -f compose.production.yaml exec -T backend wget -q -O - http://localhost:8080/internal/health | grep -q '"status":"UP"'; then
                echo "Backend is UP and healthy!"
                docker image prune -f
                exit 0
              fi
              sleep 3
            done

            echo "Healthcheck failed!"
            docker compose -f compose.production.yaml logs --tail=50 backend
            exit 1
