<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EventChat — Product Introduction</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#090c16;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif;color:#f4f5fc}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;overflow:hidden;transform-origin:center;background:radial-gradient(ellipse at 50% 0,#1b1e38 0,#0c1020 48%,#090c16 90%)}
#rig{position:absolute;inset:0;will-change:transform,opacity}
.screen{position:absolute;inset:24px 42px;border:1px solid #ffffff23;border-radius:13px;overflow:hidden;background:#0f172a;box-shadow:0 20px 70px #0005}
video{width:100%;height:100%;display:block;object-fit:cover}
#introduction{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;opacity:0}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:26px;font-size:22px;font-weight:650;letter-spacing:-.6px}.logo{width:43px;height:43px;border-radius:13px;background:#6155ee;display:grid;place-items:center}.logo svg{width:24px;height:24px}
h1{font-size:66px;line-height:1.15;font-weight:650;letter-spacing:-2.5px;margin:0 0 24px}h1 span{color:#a5a3ff}p{font-size:20px;line-height:1.65;color:#a0abc2;margin:0;max-width:740px}.cta{margin-top:32px;background:#6257ec;color:#fff;border:1px solid #8d83f4;border-radius:9px;padding:14px 24px;font-size:17px;font-weight:600;display:none}.subline{margin-top:16px;font-size:13px;color:#77869f;display:none}
.hairline{position:absolute;left:480px;right:480px;bottom:110px;height:1px;background:#9699d72b}
</style>
<div id="stage"><div id="rig"><div class="screen"><video muted playsinline preload="auto" src="eventchat-real-ui-source.webm"></video></div></div><div id="introduction"><div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="m10 8-3 3 3 3m4-6 3 3-3 3"/></svg></div>EventChat</div><h1></h1><p></p><div class="cta">Tạo phòng. Mời cả nhóm. <span style="margin-left:22px">↗</span></div><div class="subline">Không cần đăng ký tài khoản</div><div class="hairline"></div></div></div>
<script>
const video=document.querySelector('video'),rig=document.querySelector('#rig'),intro=document.querySelector('#introduction');
const clamp=x=>Math.min(1,Math.max(0,x)),ease=x=>{x=clamp(x);return x*x*x*(x*(x*6-15)+10)};
const edits=[[0,3,1,3],[3,6,7.2,8.8],[6,9,11.6,14],[9,16,15,28],[16,19,28,32],[19,25,37,43],[25,33,46,54],[33,35,54.5,57.5],[35,40,58,64],[40,44,65,69]];
const cards=[
 {start:0,end:3,title:'Bàn nhanh.<br><span>Chốt rõ. Chia sẻ ngay.</span>',description:'Một không gian cho thảo luận và những quyết định tiếp theo.',brand:true},
 {start:18,end:20,title:'Mọi ý kiến.<br><span>Một hướng đi chung.</span>',description:'Bình chọn và tương tác ngay trong phòng.'},
 {start:32,end:34,title:'Từ thảo luận<br><span>đến kết quả rõ ràng.</span>',description:'Tổng hợp nội dung. Chia sẻ biên bản.'},
 {start:40,end:44,title:'Cùng nhau bàn.<br><span>Cùng nhau tiến tới.</span>',description:'Bắt đầu cuộc thảo luận tiếp theo với EventChat.',brand:true,cta:true}
];
function camera(t){
 const edit=edits.find(e=>t>=e[0]&&t<e[1])||edits.at(-1),p=clamp((t-edit[0])/(edit[1]-edit[0]));
 // Subtle planar push-in. No orbit, perspective tilt, parallax floor or spinning screen.
 const scale=.985+.015*ease(p),x=(1-ease(p))*8;
 rig.style.transform=`translate(${x}px,0) scale(${scale})`;
 const detail=t>=19&&t<25?1.18:t>=25&&t<33?1.10:t>=33&&t<40?1.08:1;
 video.style.transform=`scale(${detail})`;video.style.transformOrigin=t>=19&&t<25?'50% 12%':'50% 50%';
 const card=cards.find(c=>t>=c.start&&t<c.end);
 if(card){const u=t-card.start,len=card.end-card.start,enter=ease(u/.6),leave=card.end===44?1:1-ease((u-len+.6)/.6),alpha=enter*leave;
  intro.style.opacity=alpha;intro.style.transform=`translateY(${(1-enter)*18}px)`;rig.style.opacity=(card.start===0||card.cta)?0:1-alpha;
  intro.querySelector('h1').innerHTML=card.title;intro.querySelector('p').textContent=card.description;
  intro.querySelector('.brand').style.visibility=card.brand?'visible':'hidden';intro.querySelector('.cta').style.display=card.cta?'block':'none';intro.querySelector('.subline').style.display=card.cta?'block':'none';
 }else{intro.style.opacity=0;rig.style.opacity=1;}
}
const ready=new Promise((resolve,reject)=>{video.addEventListener('loadeddata',resolve,{once:true});video.addEventListener('error',()=>reject(Error('Cannot load real UI source video')),{once:true})});
let lastFrame=-1;
async function seek(t){await ready;t=Math.min(44,Math.max(0,t));camera(t);const edit=edits.find(e=>t>=e[0]&&t<e[1])||edits.at(-1),sourceTime=edit[2]+clamp((t-edit[0])/(edit[1]-edit[0]))*(edit[3]-edit[2]),frame=Math.round(sourceTime*25);if(frame!==lastFrame){await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('Video seek timed out')),10000);video.addEventListener('seeked',()=>{clearTimeout(timer);resolve()},{once:true});video.currentTime=Math.min(frame/25,video.duration-.05)});lastFrame=frame;}window.currentIntroTime=t;return{time:t,sourceTime:video.currentTime};}
let running=false;async function play(){if(running)return;running=true;let previous=performance.now(),t=0;while(running&&t<44){await seek(t);const now=performance.now();t+=(now-previous)/1000;previous=now;await new Promise(requestAnimationFrame)}running=false;}
window.intro={duration:44,seek,play,pause(){running=false},edits};
function resize(){document.querySelector('#stage').style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/1280,innerHeight/720)})`}addEventListener('resize',resize);resize();if(!new URLSearchParams(location.search).has('render'))play();
</script></html>
