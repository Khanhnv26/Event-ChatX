<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EventChat — Product Launch</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030711;color:#edf3ff;font-family:"Segoe UI",Arial,sans-serif}#film{position:absolute;left:50%;top:50%;width:1280px;height:720px;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#0b234a 0,#061226 40%,#030711 83%);transform-origin:center;perspective:1800px}.beam{position:absolute;left:350px;top:-190px;width:580px;height:1000px;background:radial-gradient(ellipse at 50% 25%,#36afff38,transparent 58%);filter:blur(22px);mix-blend-mode:screen}.grid{position:absolute;inset:0;background-image:linear-gradient(#6facff0a 1px,transparent 1px),linear-gradient(90deg,#6facff0a 1px,transparent 1px);background-size:90px 90px;mask-image:radial-gradient(ellipse,#000,transparent 72%)}canvas{position:absolute;inset:0;width:1280px;height:720px;pointer-events:none}.horizon{position:absolute;width:820px;height:480px;left:230px;top:565px;border-radius:50%;border:2px solid #69a4ff88;background:radial-gradient(ellipse at 50% 0,#2367ff32,transparent 55%);box-shadow:0 -5px 26px #438dff55,inset 0 7px 20px #498aff22}.scene{position:absolute;inset:0;opacity:0;visibility:hidden;perspective:1500px;transform-style:preserve-3d}.brand{display:flex;align-items:center;justify-content:center;gap:20px;font-size:88px;font-weight:650;letter-spacing:-3.8px;white-space:nowrap}.logo{width:91px;height:91px;border-radius:27px;background:linear-gradient(145deg,#6f78ff,#4f46df);display:grid;place-items:center;box-shadow:0 0 60px #498aff3d,inset 0 1px 0 #c4d8ff70}.logo svg{width:50px;height:50px}.hero-brand{position:absolute;left:0;right:0;top:272px}.tagline{text-align:center;font-size:22px;color:#9eb5d8;font-weight:400;letter-spacing:-.3px;margin-top:24px}.hero-line{position:absolute;left:575px;top:430px;width:130px;height:1px;background:linear-gradient(90deg,transparent,#a8c8ff88,transparent)}.ghostword{position:absolute;top:42px;width:100%;font-size:148px;letter-spacing:-7px;font-weight:650;text-align:center;color:#86b8ff24}.unit{position:absolute;border:1px solid #a4c6ff42;border-radius:15px;overflow:hidden;background:#101a30;box-shadow:0 26px 70px #0007,0 0 35px #398cff12;will-change:transform,opacity;transform-style:preserve-3d}.unit img{display:block;width:100%;height:auto}.main-ui{width:790px;left:245px;top:156px;border:1px solid #9acaff88;box-shadow:0 0 45px #4ba7ff50,0 35px 80px #0009}.side-poll{width:440px;left:-165px;top:265px}.side-doc{width:360px;right:-120px;top:135px;height:480px}.side-chat{width:440px;left:125px;bottom:-60px}.section-title{position:absolute;left:0;right:0;top:93px;text-align:center;font-size:45px;font-weight:600;letter-spacing:-1.7px;line-height:1.2}.section-title span{color:#94c9ff}.bubble{width:760px;left:260px;border-radius:15px;background:#101b2d}.bubble img{width:100%}.bubble.one{top:230px}.bubble.two{top:355px}.bubble.three{top:480px}.connector{position:absolute;left:228px;top:260px;height:260px;width:1px;background:linear-gradient(#739dff00,#739dff66,#739dff00)}.poll-full{width:940px;left:170px;top:245px;border:1px solid #7babff88;box-shadow:0 0 65px #448aff2a,0 30px 65px #0008}.poll-note{position:absolute;left:0;right:0;top:574px;text-align:center;color:#adc7ed;font-size:20px}.vote-light{position:absolute;left:180px;right:180px;top:313px;height:2px;background:linear-gradient(90deg,transparent,#70c1ff,transparent);box-shadow:0 0 25px #64aaff}.decision-card{width:510px;left:65px;top:260px;box-shadow:0 0 38px #498aff22}.document{width:565px;left:644px;top:115px;height:535px}.document img{width:100%}.decision-copy{position:absolute;left:66px;top:132px;font-size:43px;line-height:1.2;font-weight:600;letter-spacing:-1.4px}.decision-copy span{color:#96c9ff}.flow-arrow{position:absolute;left:573px;top:337px;color:#92bbff;font-size:44px;font-weight:200}.end-brand{position:absolute;left:0;right:0;top:240px}.end-brand .brand{font-size:75px}.end-brand .logo{width:78px;height:78px;border-radius:23px}.end-brand .logo svg{width:43px;height:43px}.end-title{text-align:center;font-size:31px;letter-spacing:-.7px;font-weight:400;margin-top:28px;color:#d4e4ff}.end-cta{text-align:center;margin-top:23px;font-size:18px;color:#91add4}.glint{position:absolute;width:5px;height:5px;background:#b5ddff;border-radius:50%;box-shadow:0 0 18px 4px #4b9aff6b}
</style>
<div id="film"><div class="beam"></div><div class="grid"></div><canvas width="1920" height="1080"></canvas><div class="horizon"></div>
<section class="scene" id="hero"><div class="hero-brand"><div class="brand"><div class="logo"></div>EventChat</div><div class="tagline">Mọi ý kiến. Một quyết định rõ ràng.</div></div><div class="hero-line"></div></section>
<section class="scene" id="overview"><div class="ghostword">EventChat</div><div class="unit side-poll"><img src="launch-assets/poll.png"></div><div class="unit side-doc"><img src="launch-assets/report.png"></div><div class="unit side-chat"><img src="launch-assets/chat-2.png"></div><div class="unit main-ui"><img src="launch-assets/workspace.png"></div></section>
<section class="scene" id="conversation"><div class="section-title">Mọi ý tưởng.<br><span>Cùng một nơi.</span></div><div class="connector"></div><div class="unit bubble one"><img src="launch-assets/chat-1.png"></div><div class="unit bubble two"><img src="launch-assets/chat-2.png"></div><div class="unit bubble three"><img src="launch-assets/chat-3.png"></div></section>
<section class="scene" id="poll"><div class="section-title">Cùng bình chọn.<br><span>Cùng một hướng đi.</span></div><div class="unit poll-full"><img src="launch-assets/poll.png"></div><div class="vote-light"></div><div class="poll-note">Kết quả rõ ràng, ngay trong cuộc trò chuyện.</div></section>
<section class="scene" id="result"><div class="decision-copy">Từ đồng thuận<br><span>đến quyết định.</span></div><div class="unit decision-card"><img src="launch-assets/decision.png"></div><div class="flow-arrow">→</div><div class="unit document"><img src="launch-assets/report.png"></div></section>
<section class="scene" id="end"><div class="end-brand"><div class="brand"><div class="logo"></div>EventChat</div><div class="end-title">Bàn nhanh. Chốt rõ. Chia sẻ ngay.</div><div class="end-cta">Tạo phòng. Mời cả nhóm. Bắt đầu ngay.</div></div></section>
</div>
<script>
const svg='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="m10 8-3 3 3 3m4-6 3 3-3 3"/></svg>';document.querySelectorAll('.logo').forEach(e=>e.innerHTML=svg);
const clamp=x=>Math.max(0,Math.min(1,x)),smooth=x=>{x=clamp(x);return x*x*x*(x*(x*6-15)+10)},out=x=>1-Math.pow(1-clamp(x),3);
const times=[[0,3.3],[3,6.8],[6.5,10.8],[10.5,14.9],[14.6,20.1],[19.8,24]],scenes=[...document.querySelectorAll('.scene')];
function move(el,{x=0,y=0,z=0,rx=0,ry=0,rz=0,s=1,a=1}){el.style.transform=`translate3d(${x}px,${y}px,${z}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s})`;el.style.opacity=a;}
const ctx=document.querySelector('canvas').getContext('2d');let seed=887;const random=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};const particles=Array.from({length:95},()=>({x:random()*1280,y:random()*720,r:random()*1.2+.25,v:random()*5+2,phase:random()*6.28}));
function seek(t){t=Math.max(0,Math.min(24,t));
 ctx.setTransform(1.5,0,0,1.5,0,0);ctx.clearRect(0,0,1280,720);particles.forEach(p=>{ctx.beginPath();ctx.fillStyle=`rgba(140,191,255,${.1+.25*(.5+.5*Math.sin(t*.6+p.phase))})`;ctx.arc(p.x,(p.y-t*p.v+1440)%720,p.r,0,Math.PI*2);ctx.fill()});
 document.querySelector('.beam').style.transform=`translateX(${Math.sin(t*.24)*100}px) scaleX(${1+.1*Math.sin(t*.4)})`;document.querySelector('.horizon').style.opacity=t<3.4||t>19.5?'.85':'.18';
 scenes.forEach((scene,i)=>{const [start,end]=times[i],u=t-start,len=end-start,alpha=smooth((u+.12)/.5)*(i===5?1:1-smooth((u-len+.3)/.5));scene.style.opacity=alpha;scene.style.visibility=alpha<.001?'hidden':'visible';
 if(i===0){const p=out((u+.05)/1.3);move(scene.querySelector('.hero-brand'),{y:(1-p)*32,s:.94+.06*p});scene.querySelector('.brand').style.clipPath=`inset(0 ${100*(1-p)}% 0 0)`;scene.querySelector('.tagline').style.opacity=smooth((u-.75)/.8);}
 if(i===1){const p=out(u/1.2),drift=clamp(u/len);move(scene.querySelector('.main-ui'),{y:(1-p)*140,z:30,rx:(1-p)*9,ry:-3+3*drift,s:.84+.16*p});move(scene.querySelector('.side-poll'),{x:(1-p)*-200,y:Math.sin(u)*8,ry:9,s:.95,a:.5+.2*p});move(scene.querySelector('.side-doc'),{x:(1-p)*200,ry:-10,a:.5+.2*p});move(scene.querySelector('.side-chat'),{y:(1-p)*140,rx:7,a:.65});move(scene.querySelector('.ghostword'),{y:(1-p)*-40,a:.7});}
 if(i===2){move(scene.querySelector('.section-title'),{y:(1-out(u/.7))*25,a:smooth(u/.55)});scene.querySelectorAll('.bubble').forEach((el,j)=>{const p=out((u-.35-j*.58)/.9);move(el,{x:(1-p)*(j%2?85:-85),y:(1-p)*32,z:j*9,s:.94+.06*p,a:p})});}
 if(i===3){const p=out((u-.3)/1);move(scene.querySelector('.section-title'),{y:(1-out(u/.7))*20,a:smooth(u/.6)});move(scene.querySelector('.poll-full'),{y:(1-p)*70,s:.89+.11*p,ry:(1-p)*-6,a:p});const scan=clamp((u-1.05)/1.5);scene.querySelector('.vote-light').style.transform=`translateY(${scan*190}px)`;scene.querySelector('.vote-light').style.opacity=Math.sin(scan*Math.PI)*.65;scene.querySelector('.poll-note').style.opacity=smooth((u-1.8)/.7);}
 if(i===4){const p=out((u-.2)/1.1),q=out((u-.8)/1.2);move(scene.querySelector('.decision-copy'),{x:(1-p)*-40,a:p});move(scene.querySelector('.decision-card'),{x:(1-p)*-120,ry:(1-p)*10,z:35,a:p});move(scene.querySelector('.document'),{x:(1-q)*180,y:(1-q)*25,ry:(1-q)*-12,s:.9+.1*q,a:q});scene.querySelector('.flow-arrow').style.opacity=smooth((u-1.2)/.65);}
 if(i===5){const p=out(u/1.3);move(scene.querySelector('.end-brand'),{y:(1-p)*30,s:.95+.05*p});scene.querySelector('.end-title').style.opacity=smooth((u-.5)/.7);scene.querySelector('.end-cta').style.opacity=smooth((u-1.1)/.8);}
 });window.currentIntroTime=t;return{time:t};}
let animation=0;function play(){cancelAnimationFrame(animation);const start=performance.now();function tick(now){const t=(now-start)/1000;seek(t);if(t<24)animation=requestAnimationFrame(tick)}animation=requestAnimationFrame(tick)}
window.intro={duration:24,seek,play,pause(){cancelAnimationFrame(animation)}};function resize(){document.querySelector('#film').style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/1280,innerHeight/720)})`}addEventListener('resize',resize);resize();seek(0);if(!new URLSearchParams(location.search).has('render'))play();
</script></html>
