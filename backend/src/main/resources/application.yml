server:
  port: 8080

spring:
  application:
    name: eventchat-backend

  datasource:
    url: jdbc:mysql://localhost:3306/eventchat_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: root
    password: rootpassword # Thay đổi mật khẩu này nếu mật khẩu MySQL của bạn khác
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: eventchat_rabbit
    password: eventchat_rabbit_pass
