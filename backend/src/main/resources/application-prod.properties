server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=6379
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD}
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}
app.stomp.relay.host=${APP_STOMP_RELAY_HOST:rabbitmq}
app.stomp.relay.login=${SPRING_RABBITMQ_USERNAME}
app.stomp.relay.passcode=${SPRING_RABBITMQ_PASSWORD}
app.allowed-origins=${APP_ALLOWED_ORIGINS}
spring.jpa.show-sql=false
spring.flyway.baseline-on-migrate=false
server.error.include-message=never
server.error.include-stacktrace=never
spring.jpa.open-in-view=false
logging.level.org.springframework.web.socket=INFO
