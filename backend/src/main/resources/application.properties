spring.config.import=optional:file:./application-secrets.properties.local[.properties],optional:file:./backend/application-secrets.properties.local[.properties]

server.port=8080
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
app.allowed-origins=http://localhost:4000,http://127.0.0.1:4000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080

app.rate-limit.chat.capacity=5
app.rate-limit.chat.refill-per-second=0.5
app.rate-limit.tool-create.capacity=3
app.rate-limit.tool-create.refill-per-second=0.1
app.rate-limit.vote.capacity=10
app.rate-limit.vote.refill-per-second=2
app.rate-limit.spin.capacity=3
app.rate-limit.spin.refill-per-second=0.5
app.rate-limit.create-room.capacity=3
app.rate-limit.create-room.refill-per-second=0.016666667
app.rate-limit.join-room.capacity=20
app.rate-limit.join-room.refill-per-second=1
app.rate-limit.room-join.capacity=50
app.rate-limit.room-join.refill-per-second=5
app.rate-limit.ip-write.capacity=30
app.rate-limit.ip-write.refill-per-second=5
app.rate-limit.room-write.capacity=100
app.rate-limit.room-write.refill-per-second=50
app.rate-limit.host-write.capacity=5
app.rate-limit.host-write.refill-per-second=1
app.rate-limit.trusted-proxies=
server.forward-headers-strategy=NONE
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=1s


spring.application.name=eventchat-backend
management.server.port=9090
management.endpoints.web.exposure.include=prometheus
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true


spring.data.redis.host=localhost
spring.data.redis.port=6379


spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672

spring.data.mongodb.auto-index-creation=true

app.stomp.relay.host=localhost
app.stomp.relay.port=61613
app.upload.storage.provider=${APP_UPLOAD_STORAGE_PROVIDER:local}
app.upload.storage.root=./artifacts/uploads
app.upload.storage.account-id=${R2_ACCOUNT_ID:}
app.upload.storage.access-key-id=${R2_ACCESS_KEY_ID:}
app.upload.storage.secret-access-key=${R2_SECRET_ACCESS_KEY:}
app.upload.storage.bucket=${R2_BUCKET_NAME:}
app.upload.storage.max-object-bytes=20971520

app.rate-limit.upload-intent.capacity=4
app.rate-limit.upload-intent.refill-per-second=0.1
app.rate-limit.upload-content.capacity=4
app.rate-limit.upload-content.refill-per-second=0.1
app.rate-limit.attachment-cancel.capacity=10
app.rate-limit.attachment-cancel.refill-per-second=1
spring.task.scheduling.pool.size=4
