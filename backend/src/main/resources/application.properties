spring.config.import=optional:file:./application-secrets.properties.local

server.port=8080

app.rate-limit.chat.capacity=5
app.rate-limit.chat.refill-per-second=0.5
app.rate-limit.tool-create.capacity=3
app.rate-limit.tool-create.refill-per-second=0.1
app.rate-limit.vote.capacity=10
app.rate-limit.vote.refill-per-second=2
app.rate-limit.spin.capacity=3
app.rate-limit.spin.refill-per-second=0.5
app.rate-limit.create-room.capacity=3
app.rate-limit.create-room.refill-per-second=0.016666667
app.rate-limit.join-room.capacity=20
app.rate-limit.join-room.refill-per-second=1
app.rate-limit.room-join.capacity=50
app.rate-limit.room-join.refill-per-second=5
app.rate-limit.ip-write.capacity=30
app.rate-limit.ip-write.refill-per-second=5
app.rate-limit.room-write.capacity=100
app.rate-limit.room-write.refill-per-second=50
app.rate-limit.host-write.capacity=5
app.rate-limit.host-write.refill-per-second=1
app.rate-limit.trusted-proxies=
server.forward-headers-strategy=NONE
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=1s


spring.application.name=eventchat-backend


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true


spring.data.redis.host=localhost
spring.data.redis.port=6379


spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672

spring.data.mongodb.auto-index-creation=true

app.stomp.relay.host=localhost
app.stomp.relay.port=61613
