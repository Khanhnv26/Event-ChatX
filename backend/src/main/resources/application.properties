
server.port=8080


spring.application.name=eventchat-backend


spring.datasource.url=jdbc:mysql://localhost:3306/eventchat_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true


spring.data.redis.host=localhost
spring.data.redis.port=6379


spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=eventchat_rabbit
spring.rabbitmq.password=eventchat_rabbit_pass

spring.data.mongodb.uri=mongodb://localhost:27017/eventchat_db
spring.data.mongodb.auto-index-creation=true